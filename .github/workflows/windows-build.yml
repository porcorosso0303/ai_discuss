name: Windows portable build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - run: npm ci
      - run: npm run install:electron
      - run: npm run build:credential-helper
      - run: npm run stage:codex
      - run: npm run verify:staged-runtime
      - name: Run npm test
        shell: pwsh
        run: |
          $testTemp = Join-Path $env:GITHUB_WORKSPACE '.ci-temp'
          New-Item -ItemType Directory -Path $testTemp -Force | Out-Null
          $env:TEMP = $testTemp
          $env:TMP = $testTemp
          npm test
      - run: npm run typecheck
      - run: npm run lint
      - name: Run npm run test:e2e
        shell: pwsh
        run: |
          $testTemp = Join-Path $env:GITHUB_WORKSPACE '.ci-temp'
          New-Item -ItemType Directory -Path $testTemp -Force | Out-Null
          $env:TEMP = $testTemp
          $env:TMP = $testTemp
          npm run test:e2e
      - run: npm run dist:win
      - run: npm run verify:artifact
      - run: Get-FileHash dist/AI-Debates-Portable-x64.exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Debates-Portable-x64
          path: dist/AI-Debates-Portable-x64.exe
          if-no-files-found: error
