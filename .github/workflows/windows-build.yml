name: Windows portable build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      # The default Windows TEMP can contain an 8.3 alias (RUNNER~1).
      # Use the runner's full path for filesystem and Electron test fixtures.
      TEMP: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - run: npm ci
      - run: npm run build:credential-helper
      - run: npm run stage:codex
      - run: npm run verify:staged-runtime
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:e2e
      - run: npm run dist:win
      - run: npm run verify:artifact
      - run: Get-FileHash dist/AI-Debates-Portable-x64.exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Debates-Portable-x64
          path: dist/AI-Debates-Portable-x64.exe
          if-no-files-found: error
